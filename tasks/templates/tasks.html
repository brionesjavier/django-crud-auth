{% extends "layouts/base.html"%}

{% block content%}
<h1>{{title}}</h1>
<a href="{% url 'create_task'%}"> create tasks</a>

<ul>
{% for task in tasks%}
<li>
    {%if task.important%}
    <strong>{{task.title}}</strong>
    {% else %}
    {{task.title}}
    {% endif %}
    <p>{{task.description}}</p>
    <p>creado por: {{task.user.username}}</p>
    <a href="{% url 'task_detail' task.id %}">Detalles</a>


{% endfor%}

</ul>

{% endblock %}
